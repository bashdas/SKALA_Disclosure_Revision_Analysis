[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-business-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "disclosure-shared==0.1.0",
    "SQLAlchemy>=2.0,<2.1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "PyJWT>=2.10,<3",
    "argon2-cffi>=23.1,<26",
    "pika>=1.3.2,<1.4",
    "python-multipart>=0.0.20,<0.1",
    "email-validator>=2.2,<3",
    "mcp>=1.12,<2",
    "httpx>=0.28,<1",
    "markdown-it-py>=3,<5",
    "weasyprint>=68,<71",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = ["postgres: requires TEST_DATABASE_URL pointing to a disposable PostgreSQL database"]
