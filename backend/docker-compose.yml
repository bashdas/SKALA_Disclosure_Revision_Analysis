services:
  business-api:
    build:
      context: .
      dockerfile: business-api/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:${BUSINESS_API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_started

  business-mcp:
    build:
      context: .
      dockerfile: mcp/business-mcp/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      BUSINESS_API_BASE_URL: ${BUSINESS_API_BASE_URL:-http://business-api:8080}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-}
      BUSINESS_MCP_HOST: ${BUSINESS_MCP_HOST:-0.0.0.0}
      BUSINESS_MCP_PORT: ${BUSINESS_MCP_PORT:-8081}
      BUSINESS_MCP_REQUEST_TIMEOUT_SECONDS: ${BUSINESS_MCP_REQUEST_TIMEOUT_SECONDS:-30}
    expose:
      - "${BUSINESS_MCP_PORT:-8081}"
    depends_on:
      business-api:
        condition: service_healthy

  external-mcp:
    build:
      context: .
      dockerfile: mcp/external-mcp/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      SEC_USER_AGENT: ${SEC_USER_AGENT:-DisclosureResearch/1.0}
      OPENDART_API_KEY: ${OPENDART_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      OPENDART_BASE_URL: ${OPENDART_BASE_URL:-https://opendart.fss.or.kr/api}
      OPENDART_MAX_DOWNLOAD_BYTES: ${OPENDART_MAX_DOWNLOAD_BYTES:-20971520}
      OPENDART_METADATA_MAX_PAGES: ${OPENDART_METADATA_MAX_PAGES:-100}
      EXTERNAL_MCP_HOST: ${EXTERNAL_MCP_HOST:-0.0.0.0}
      EXTERNAL_MCP_PORT: ${EXTERNAL_MCP_PORT:-8083}
      EXTERNAL_MCP_REQUEST_TIMEOUT_SECONDS: ${EXTERNAL_MCP_REQUEST_TIMEOUT_SECONDS:-30}
    expose:
      - "${EXTERNAL_MCP_PORT:-8083}"

  rag-mcp:
    build:
      context: .
      dockerfile: mcp/rag-mcp/Dockerfile
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-local}
      DATABASE_URL: ${DATABASE_URL:?Copy .env.example to .env}
      BUSINESS_MCP_URL: ${BUSINESS_MCP_URL:-http://business-mcp:8081/mcp}
      EXTERNAL_MCP_URL: ${EXTERNAL_MCP_URL:-http://external-mcp:8083/mcp}
      RAG_MCP_HOST: ${RAG_MCP_HOST:-0.0.0.0}
      RAG_MCP_PORT: ${RAG_MCP_PORT:-8082}
      RAG_MCP_REQUEST_TIMEOUT_SECONDS: ${RAG_MCP_REQUEST_TIMEOUT_SECONDS:-60}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE:-1000}
      RAG_CHUNK_OVERLAP: ${RAG_CHUNK_OVERLAP:-100}
      NEWS_COLLECTION_ENABLED: ${NEWS_COLLECTION_ENABLED:-true}
      NEWS_COLLECTION_INTERVAL_SECONDS: ${NEWS_COLLECTION_INTERVAL_SECONDS:-3600}
      NEWS_RETENTION_DAYS: ${NEWS_RETENTION_DAYS:-30}
      NEWS_CLASSIFICATION_MODEL: ${NEWS_CLASSIFICATION_MODEL:-gpt-5.4-mini}
      RAG_MIN_SIMILARITY: ${RAG_MIN_SIMILARITY:-0.6}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    expose:
      - "${RAG_MCP_PORT:-8082}"
    depends_on:
      postgres:
        condition: service_healthy
      business-mcp:
        condition: service_healthy
      external-mcp:
        condition: service_healthy

  ai-worker:
    build:
      context: ../ai
      dockerfile: Dockerfile
    environment:
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-disclosure-ai-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_WORKSPACE_ID: ${LANGSMITH_WORKSPACE_ID:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      RABBITMQ_URL: ${RABBITMQ_URL:?Configure RabbitMQ}
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-analysis.exchange}
      RABBITMQ_ANALYSIS_QUEUE: ${RABBITMQ_ANALYSIS_QUEUE:-analysis.tasks}
      RABBITMQ_MAX_RETRIES: ${RABBITMQ_MAX_RETRIES:-3}
      BUSINESS_MCP_URL: ${BUSINESS_MCP_URL:-http://business-mcp:8081/mcp}
      EXTERNAL_MCP_URL: ${EXTERNAL_MCP_URL:-http://external-mcp:8083/mcp}
      RAG_MCP_URL: http://rag-mcp:8082/mcp
    volumes:
      - ai-state:/state
    depends_on:
      rabbitmq:
        condition: service_healthy
      business-mcp:
        condition: service_healthy
      external-mcp:
        condition: service_healthy
      rag-mcp:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy .env.example to .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:?Copy .env.example to .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports:
      - "127.0.0.1:${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?Copy .env.example to .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?Copy .env.example to .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
  rabbitmq-data:
  ai-state:
