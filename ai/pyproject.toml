[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "disclosure-ai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "httpx>=0.28,<1",
  "pika>=1.3.2,<1.4", "mcp>=1.30,<2", "openai>=2,<3", "langgraph>=1,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "tiktoken>=0.9,<1",
  "defusedxml>=0.7,<1", "beautifulsoup4>=4.13,<5"
]
[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]
[tool.setuptools.packages.find]
include = ["disclosure_ai*"]
[tool.setuptools.package-data]
disclosure_ai = ["prompts/*.md"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "ASYNC"]
